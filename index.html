    <!-- JavaScript -->
    <script>
        // 移动端菜单切换
        document.getElementById('menu-toggle').addEventListener('click', function() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        });

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 80,
                        behavior: 'smooth'
                    });
                    // 关闭移动端菜单
                    document.getElementById('mobile-menu').classList.add('hidden');
                }
            });
        });

        // Tab 切换功能
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanels = document.querySelectorAll('.tab-panel');

        // 视频按需加载：只加载当前 Tab 的视频，切换到新 Tab 时才加载对应视频的 metadata
        function loadVideoInPanel(panel) {
            const video = panel.querySelector('video');
            if (video && video.preload === 'none') {
                video.preload = 'metadata';
                video.load();
            }
        }

        function switchTab(activeBtn) {
            const targetId = activeBtn.dataset.tab;

            // 更新 Tab 按钮的选中样式
            tabButtons.forEach(btn => {
                const isActive = btn === activeBtn;
                btn.classList.toggle('bg-primary', isActive);
                btn.classList.toggle('text-white', isActive);
                btn.classList.toggle('shadow-md', isActive);
                btn.classList.toggle('text-gray-600', !isActive);
                btn.classList.toggle('hover:text-primary', !isActive);
                btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });

            // 切换对应的面板
            tabPanels.forEach(panel => {
                panel.classList.toggle('active', panel.id === targetId);
            });

            // 切换 Tab 时：所有轮播回到第一张、暂停所有视频
            document.querySelectorAll('video').forEach(v => v.pause());
            document.querySelectorAll('.carousel').forEach(c => {
                if (c._goTo) c._goTo(0);
            });

            // 按需加载新 Tab 的视频（只拉 metadata，不下载视频数据）
            tabPanels.forEach(panel => {
                if (panel.id === targetId) loadVideoInPanel(panel);
            });
        }

        tabButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                switchTab(this);
            });
        });

        // 页面打开时：预加载当前显示的第一个 Tab 的视频 metadata
        loadVideoInPanel(document.querySelector('.tab-panel.active'));

        // 媒体轮播：左右箭头 + 缩略图切换（视频 / 截图）
        document.querySelectorAll('.carousel').forEach(carousel => {
            const track = carousel.querySelector('.carousel-track');
            const slides = carousel.querySelectorAll('.carousel-slide');
            const thumbs = carousel.querySelectorAll('.carousel-thumb');
            const prevBtn = carousel.querySelector('.carousel-prev');
            const nextBtn = carousel.querySelector('.carousel-next');
            const total = slides.length;
            let index = 0;

            function goTo(i) {
                index = (i + total) % total;
                track.style.transform = 'translateX(-' + (index * 100) + '%)';
                thumbs.forEach((t, ti) => {
                    t.classList.toggle('active', ti === index);
                    t.classList.toggle('border-blue-500', ti === index);
                    t.classList.toggle('border-gray-600', ti !== index);
                });
                // 切走时暂停对应的视频
                slides.forEach((s, si) => {
                    const v = s.querySelector('video');
                    if (v && si !== index) v.pause();
                });
            }

            carousel._goTo = goTo;

            if (prevBtn) prevBtn.addEventListener('click', function() { goTo(index - 1); });
            if (nextBtn) nextBtn.addEventListener('click', function() { goTo(index + 1); });
            thumbs.forEach((t, ti) => t.addEventListener('click', function() { goTo(ti); }));
        });

        // 视频播放功能：点击"观看视频"，切到视频那张并播放
        document.querySelectorAll('.watch-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const panel = this.closest('.tab-panel');
                const carousel = panel.querySelector('.carousel');
                if (carousel && carousel._goTo) carousel._goTo(0);
                const video = panel.querySelector('video');
                if (video) video.play();
            });
        });

        // 同一时间只播放一个视频
        document.querySelectorAll('video').forEach(v => {
            v.addEventListener('play', function() {
                document.querySelectorAll('video').forEach(other => {
                    if (other !== v) other.pause();
                });
            });
        });
    </script>
</body>
</html>
